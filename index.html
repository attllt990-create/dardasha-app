<html lang="ar" dir="rtl">
<head>

<link rel="manifest" href="manifest.json">

<style>
:root{--bg:#fff;--fg:#111;--mut:#8e8e8e;--line:#efefef;--in:#efefef;--out:#3797f0;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#000;--fg:#f5f5f5;--mut:#a8a8a8;--line:#262626;--in:#262626;color-scheme:dark}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column;background:var(--bg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;font-size:16px;color:var(--fg)}
.top{display:flex;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.logo{font-size:26px;font-weight:800;flex:1}
#bell{font-size:24px;position:relative;padding:2px 6px}
#dot{position:absolute;top:2px;right:4px;width:10px;height:10px;border-radius:50%;background:#ef4444;display:none}
#main{flex:1;position:relative;min-height:0}
.view{position:absolute;inset:0;overflow-y:auto;display:none}
#nav{display:flex;border-top:1px solid var(--line)}
#nav button{flex:1;padding:10px 0;font-size:22px;opacity:.5}
#nav button.on{opacity:1}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;color:#333;font-weight:700;flex:0 0 auto}
.row{display:flex;align-items:center;gap:12px;padding:10px 16px;width:100%;text-align:start}
.row:active{background:var(--line)}
.tx{flex:1;min-width:0}
.tx b{display:block;font-size:15px}
.tx span{display:block;font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{padding:50px 24px;text-align:center;color:var(--mut);font-size:15px;line-height:1.7;white-space:pre-line}
.field{display:block;width:calc(100% - 32px);margin:12px 16px;padding:11px 14px;border-radius:10px;background:var(--in);border:0}
.pf{padding:16px}
.pft{display:flex;align-items:center;gap:20px}
.stats2{flex:1;display:flex;justify-content:space-around;text-align:center}
.stats2 b{display:block;font-size:17px}
.stats2 span{font-size:13px;color:var(--mut)}
.pn{font-weight:700;margin-top:12px}
.pb{font-size:14px;margin-top:4px;white-space:pre-wrap;overflow-wrap:anywhere}
.acts{display:flex;gap:8px;margin-top:14px}
.btn{background:var(--out);color:#fff;padding:11px;border-radius:8px;font-weight:700;width:100%;margin-top:10px}
.btn.g{background:var(--in);color:var(--fg)}
a.btn{display:block;text-align:center;text-decoration:none;margin-top:10px}
.pu{color:var(--mut);font-size:13px;margin-top:2px}
a.ig{color:var(--out);font-size:14px;font-weight:700;text-decoration:none}
.acts .btn{margin:0;flex:1;padding:8px;font-size:14px}
.form{margin-top:12px}
.form input,.form textarea{display:block;width:100%;padding:10px;margin-bottom:8px;border-radius:10px;border:0;background:var(--in)}
.form textarea{height:70px;resize:none}
#msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:6px}
.m{max-width:75%;padding:9px 14px;border-radius:20px;font-size:15px;line-height:1.4;overflow-wrap:anywhere}
.m.me{align-self:flex-start;background:var(--out);color:#fff}
.m.th{align-self:flex-end;background:var(--in)}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line)}
header h1{font-size:16px}
.bar{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);align-items:center}
.bar input{flex:1;padding:11px 16px;border-radius:22px;border:1px solid var(--line);background:var(--bg)}
.send{color:var(--out);font-weight:700;padding:8px}
.box{margin:auto;width:min(340px,90%);display:flex;flex-direction:column;gap:10px;text-align:center}
.box .logo{font-size:40px;flex:none;margin-bottom:10px}
.box input{padding:12px 14px;border-radius:8px;border:1px solid var(--line);background:var(--in);text-align:start}
#err{color:#e11d48;font-size:13px;min-height:18px}
.sw{font-size:14px;color:var(--mut)}
.sw button{color:var(--out);font-weight:700}

:root{--bg:#0b1117;--fg:#f1f5f9;--mut:#7d8b99;--line:#1b2733;--in:#151e29;--out:#0d9488;--acc:#2dd4bf;color-scheme:dark}
svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.gt{background:linear-gradient(90deg,#5eead4,#22d3ee,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo{text-align:center;letter-spacing:.5px}
.sp{width:38px}
#bell{font-size:0;padding:4px 6px;color:var(--acc);width:38px}
#dot{background:#f43f5e;top:2px;right:6px}
#nav button{opacity:1;font-size:0;padding:12px 0;color:var(--mut);display:flex;justify-content:center}
#nav button.on{color:var(--acc)}
#nav button.on svg{stroke-width:2.3}
.btn{background:linear-gradient(135deg,#0d9488,#0891b2);border-radius:12px;box-shadow:0 6px 18px #0d948833}
.btn.g{background:var(--in);box-shadow:none;border:1px solid var(--line)}
.btn.gold{background:linear-gradient(135deg,#fbbf24,#d97706);color:#1a1205;box-shadow:none}
.m.me{background:linear-gradient(135deg,#0d9488,#0e7490)}
.send,.sw button,a.ig{color:var(--acc)}
.field,.form input,.form textarea{border:1px solid var(--line)}
#auth{background:radial-gradient(circle at 50% -5%,#0f766e66,transparent 55%),var(--bg)}
.box{gap:12px}
.box .logo{font-size:46px;margin-bottom:2px;font-weight:900}
.tag{color:var(--mut);font-size:14px;margin-bottom:14px}
.box input{padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--in)}
.box input:focus{outline:0;border-color:var(--acc)}
.sw{margin-top:16px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--in)}
.stories{display:flex;gap:14px;padding:14px 16px;overflow-x:auto}
.st{flex:0 0 auto;width:72px;text-align:center;font-size:12px;color:var(--mut)}
.ring{width:72px;height:72px;border-radius:50%;padding:3px;background:linear-gradient(45deg,#f9a825,#e1306c,#8b5cf6);position:relative;margin-bottom:5px}
.ring.me{background:var(--line)}
.ring .av,.ring img{border:3px solid var(--bg)}
.plus{position:absolute;bottom:-2px;left:-2px;width:22px;height:22px;border-radius:50%;background:var(--out);color:#fff;font-style:normal;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg);line-height:1}
.uh{font-size:20px;font-weight:800;color:var(--acc);margin-bottom:14px}
.ptabs{display:flex;border-bottom:1px solid var(--line);margin:20px -16px 0}
.ptabs button{flex:1;padding:12px 0;color:var(--mut);display:flex;justify-content:center;border-bottom:2px solid transparent}
.ptabs button.on{color:var(--acc);border-color:var(--acc)}
.uh{display:flex;align-items:center;justify-content:space-between}
.sh{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.sh h2{font-size:17px;flex:1}
.sep{height:6px;background:var(--in);margin-top:6px}
.sec{padding:12px 16px 4px;color:var(--mut);font-size:13px}
.srow{display:flex;align-items:center;gap:14px;padding:13px 16px;width:100%;text-align:start}
.srow:active{background:var(--in)}
.srow svg{width:24px;height:24px}
.srow .t{flex:1;font-size:15px}
.srow .t small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.srow .c{color:var(--mut);font-size:22px}
.srow.red{color:#f43f5e}
.sfld{display:block;width:100%;padding:13px 14px;margin-top:10px;border-radius:12px;border:1px solid var(--line);background:var(--in)}
.st{cursor:pointer}
.ring.none{background:var(--line)}
.ring.seen{background:#3b4754}
.nb{background:var(--in);border:1px solid var(--line);border-radius:14px;padding:4px 8px;font-size:11px;color:var(--fg);margin:0 auto 4px;max-width:72px;min-height:24px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nb.em{color:var(--mut)}
.nb.sp0{visibility:hidden}
#plus{width:38px;padding:4px 6px;color:var(--acc)}
.post{margin-bottom:18px}.phd{display:flex;align-items:center;gap:10px;padding:8px 14px}.pac{padding:6px 12px;font-size:26px}.pcnt{padding:0 14px;font-weight:700;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin:0 -16px}
.cell{position:relative;aspect-ratio:1;background:#222}.cell img{width:100%;height:100%;object-fit:cover}
.vp{position:absolute;top:6px;right:6px;color:#fff;font-style:normal;font-size:14px}
.snap{scroll-snap-type:y mandatory;background:#000}
.reel{height:100%;scroll-snap-align:start;position:relative;color:#fff}
.reel video{width:100%;height:100%;object-fit:contain}
.rov{position:absolute;inset:auto 0 0 0;padding:16px;background:linear-gradient(transparent,#0009);font-size:14px}
</style>
</head>
<body>
<div class="screen" id="load" style="display:flex"><div class="box"><h2 class="logo"><span class="gt">سوريا</span> 🇸🇾</h2></div></div>
<div class="screen" id="auth"><div class="box"><h2 class="logo"><span class="gt">سوريا</span> 🇸🇾</h2><div class="tag">تواصل، شارك، وتابع ناسك</div>
<input id="au" placeholder="اسم المستخدم" autocapitalize="none" autocomplete="username" dir="ltr">
<input id="ap" type="password" placeholder="كلمة المرور" autocomplete="current-password" dir="ltr">
<input id="ac" type="password" placeholder="تأكيد كلمة المرور" dir="ltr" style="display:none">
<div id="err"></div><button id="go" class="btn">تسجيل الدخول</button>
<div class="sw"><span id="swt">ما عندك حساب؟</span> <button id="swb">إنشاء حساب</button></div>
<a class="ig" href="https://www.instagram.com/a.__h811/" target="_blank" rel="noopener noreferrer">📷 تابع المطوّر على إنستغرام</a></div></div>

<div class="screen" id="app">
  <div class="top"><button id="plus" aria-label="جديد"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button><div class="logo"><span class="gt">سوريا</span> 🇸🇾</div><button id="bell" aria-label="الإشعارات"><svg viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z"/></svg><i id="dot"></i></button></div>
  <div id="main">
    <div class="view" id="v-home"><div class="empty">المنشورات والريلز قريباً 🎬</div></div>
    <div class="view" id="v-reels"><div class="empty">الريلز قريباً 🎬</div></div>
    <div class="view" id="v-search"><input class="field" id="sq" placeholder="ابحث عن مستخدم" dir="ltr" autocapitalize="none"><div id="sres"></div></div>
    <div class="view" id="v-chats"></div>
    <div class="view" id="v-me"></div>
    <div class="view" id="v-notif"></div>
    <div class="view" id="v-user"></div>
    <div class="view" id="v-prem"></div>
    <div class="view" id="v-set"></div>
  </div>
  <div id="nav">
    <button data-t="home" aria-label="الرئيسية"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></button><button data-t="reels" aria-label="ريلز"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M10 8.5l6 3.5-6 3.5z"/></svg></button><button data-t="chats" aria-label="الرسائل"><svg viewBox="0 0 24 24"><path d="M21 3L3 10.5l7 3 3 7z"/><path d="M10 13.5L21 3"/></svg></button><button data-t="search" aria-label="استكشاف"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg></button><button data-t="me" aria-label="ملفي"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg></button>
  </div>
</div>

<div class="screen" id="chat">
  <header><button id="back" aria-label="رجوع" style="font-size:22px">→</button><div id="hav"></div><h1 id="hname"></h1></header>
  <div id="msgs"></div>
  <div class="bar"><button class="send" id="att" aria-label="مرفق">📎</button><input id="inp" placeholder="اكتب رسالة..." autocomplete="off"><button class="send" id="mic" aria-label="تسجيل صوتي">🎤</button><button class="send" id="send">إرسال</button></div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,onAuthStateChanged,signOut,reauthenticateWithCredential,EmailAuthProvider,updatePassword,deleteUser} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,setDoc,getDoc,addDoc,updateDoc,collection,query,where,orderBy,limit,onSnapshot,startAt,endAt,serverTimestamp,getDocs,deleteDoc,getCountFromServer,arrayUnion,arrayRemove} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD-v2mci9SakvXhIcvBaSsq5p5wrZ7GhP0",
  authDomain: "ggajq-63a88.firebaseapp.com",
  projectId: "ggajq-63a88",
  storageBucket: "ggajq-63a88.firebasestorage.app",
  messagingSenderId: "218459278203",
  appId: "1:218459278203:web:c94075b3785c9ee565cbde"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=i=>document.getElementById(i);
const h=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const mail=u=>u+"@users.syria.app";
let me=null,uname="",mode="login",subs=[],chats=[],notifs=[],cur=null,msgSub=null,tab="home";

function ava(n,s,p){if(p){const i=document.createElement("img");i.src=p;i.className="av";i.style.cssText=`width:${s}px;height:${s}px;object-fit:cover`;return i}const a=h("div","av",(n||"?")[0].toUpperCase());let k=0;for(const ch of n||"")k+=ch.charCodeAt(0);
  a.style.cssText=`width:${s}px;height:${s}px;font-size:${s/2.2}px;background:hsl(${k*47%360},65%,78%)`;return a}
const scr=n=>["load","auth","app","chat"].forEach(i=>$(i).style.display=i===n?"flex":"none");
const chatId=(a,b)=>[a,b].sort().join("_");

/* ---------- auth ---------- */
const fail=t=>$("err").textContent=t;
function setMode(m){mode=m;const s=m==="signup";
  $("ac").style.display=s?"block":"none";$("go").textContent=s?"إنشاء حساب":"تسجيل الدخول";
  $("swt").textContent=s?"عندك حساب؟":"ما عندك حساب؟";$("swb").textContent=s?"سجّل دخولك":"إنشاء حساب";$("err").textContent=""}
function errMsg(e){const c=e.code||"";
  if(c==="auth/email-already-in-use")return"اسم المستخدم مأخوذ، جرّب غيره";
  if(c==="auth/network-request-failed")return"ما في اتصال بالإنترنت";
  if(c==="auth/weak-password")return"كلمة المرور ضعيفة";
  if(c==="auth/too-many-requests")return"محاولات كتيرة، جرّب بعد شوي";
  if(c==="auth/operation-not-allowed")return"فعّل Email/Password في Firebase";
  return"اسم المستخدم أو كلمة المرور غلط"}
async function submit(){
  const u=$("au").value.trim().toLowerCase(),p=$("ap").value;
  if(!/^[a-z0-9._]{3,20}$/.test(u))return fail("اسم المستخدم: من 3 إلى 20 حرف إنكليزي أو أرقام أو . _");
  if(p.length<6)return fail("كلمة المرور لازم 6 أحرف على الأقل");
  $("go").disabled=true;
  try{
    if(mode==="signup"){
      if(p!==$("ac").value){$("go").disabled=false;return fail("كلمتا المرور غير متطابقتين")}
      const tk=await getDoc(doc(db,"usernames",u)).catch(()=>null);if(tk&&tk.exists()){$("go").disabled=false;return fail("اسم المستخدم مأخوذ، جرّب غيره")}
      const c=await createUserWithEmailAndPassword(auth,mail(u),p);
      await setDoc(doc(db,"users",c.user.uid),{username:u,name:"",bio:""});
      await setDoc(doc(db,"usernames",u),{uid:c.user.uid,email:mail(u)}).catch(()=>{});
    }else{let em=mail(u);try{const x=await getDoc(doc(db,"usernames",u));if(x.exists())em=x.data().email}catch(e){}await signInWithEmailAndPassword(auth,em,p)}
  }catch(e){fail(errMsg(e))}
  $("go").disabled=false;
}
$("go").onclick=submit;
$("swb").onclick=()=>setMode(mode==="login"?"signup":"login");
["au","ap","ac"].forEach(i=>$(i).addEventListener("keydown",e=>{if(e.key==="Enter")submit()}));

onAuthStateChanged(auth,u=>{
  subs.forEach(f=>f());subs=[];
  if(!u){me=null;setMode("login");$("ap").value="";$("ac").value="";scr("auth");return}
  me=u;uname=u.email.split("@")[0];$("ap").value="";$("ac").value="";
  getDoc(doc(db,"users",u.uid)).then(x=>{if(x.exists()&&x.data().username)uname=x.data().username;getDoc(doc(db,"usernames",uname)).then(y=>{if(!y.exists())setDoc(doc(db,"usernames",uname),{uid:u.uid,email:u.email}).catch(()=>{})}).catch(()=>{})}).catch(()=>{});
  subs.push(onSnapshot(query(collection(db,"chats"),where("members","array-contains",u.uid)),s=>{
    chats=s.docs.map(d=>({id:d.id,...d.data()}));if(tab==="chats")rChats()},()=>{}));
  subs.push(onSnapshot(query(collection(db,"users",u.uid,"notifs"),orderBy("t","desc"),limit(30)),s=>{
    notifs=s.docs.map(d=>({id:d.id,...d.data()}));$("dot").style.display=notifs.some(n=>!n.r)?"block":"none";if(tab==="notif")rNotif()},()=>{}));
  scr("app");show("home");
});

/* ---------- tabs ---------- */
function show(t){
  tab=t;document.querySelector(".top").style.display=t==="home"?"flex":"none";["home","reels","search","chats","me","notif","user","prem","set"].forEach(v=>$("v-"+v).style.display=v===t?"block":"none");
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));
  ({home:rHome,set(){},reels:rReels,user(){},prem:rPrem,search:rSearch,chats:rChats,me:rMe,notif:rNotif})[t]();
}
document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>show(b.dataset.t));
$("bell").onclick=()=>show("notif");

/* ---------- search ---------- */
let st=0;
async function rSearch(){
  const q=$("sq").value.trim().toLowerCase(),r=$("sres"),my=++st;r.textContent="";
  if(!q){r.appendChild(h("div","empty","اكتب اسم المستخدم للبحث"));return}
  try{
    const s=await getDocs_(q);if(my!==st)return;
    const list=s.docs.map(d=>({uid:d.id,...d.data()})).filter(x=>x.uid!==me.uid);
    if(!list.length){r.appendChild(h("div","empty","ما لقينا حدا بهالاسم"));return}
    list.forEach(o=>{
      const b=h("button","row");b.appendChild(ava(o.username,48,o.photo));
      const t=h("div","tx");t.appendChild(h("b",null,o.username));t.appendChild(h("span",null,o.name||"اضغط لبدء دردشة"));b.appendChild(t);
      b.onclick=()=>openUser(o.uid);r.appendChild(b);
    });
  }catch(e){r.appendChild(h("div","empty","تعذّر البحث، تأكد من الاتصال"))}
}
function getDocs_(q){return getDocs(query(collection(db,"users"),orderBy("username"),startAt(q),endAt(q+"\uf8ff"),limit(20)))}
$("sq").oninput=rSearch;

/* ---------- chats ---------- */
function rChats(){
  const c=$("v-chats");c.textContent="";
  {const hd=h("div","sh");hd.appendChild(h("h2",null,"الرسائل"));c.appendChild(hd)}
  loadPeople().then(pp=>{if(tab!=="chats")return;const r=peopleRow(pp,true);const old=c.querySelector(".stories");if(old)old.replaceWith(r);else c.insertBefore(r,c.children[1]||null)});
  const l=[...chats].sort((a,b)=>(b.t?.seconds||9e9)-(a.t?.seconds||9e9));
  if(!l.length){c.appendChild(h("div","empty","ما عندك محادثات بعد.\nروح على 🔍 وابحث عن حدا."));return}
